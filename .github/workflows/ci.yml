# Intégration continue — exécutée sur chaque push et chaque pull request.
# Bloquant : tests PHP + build front + test navigateur du mode hors ligne.
# Informatif : style de code (Pint) — le code existant n'est pas encore formaté.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'
  PHP_EXTENSIONS: mbstring, intl, zip, gd, bcmath, pdo_sqlite, sqlite3

jobs:
  # ─────────────────────────────────────────────
  # Tests PHP (PHPUnit, SQLite en mémoire)
  # ─────────────────────────────────────────────
  tests:
    name: Tests PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate

      # Les pages Filament chargent le manifeste Vite : on construit les assets avant les tests
      - name: Build front
        run: |
          npm ci
          npm run build

      - name: PHPUnit
        run: php artisan test

  # ─────────────────────────────────────────────
  # Test navigateur du mode hors ligne (Chrome réel)
  # ─────────────────────────────────────────────
  e2e-offline:
    name: E2E mode hors ligne
    runs-on: ubuntu-latest
    needs: tests
    env:
      APP_URL: http://127.0.0.1:8099
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      E2E_BASE_URL: http://127.0.0.1:8099
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer et construire
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate
          npm ci
          npm run build

      - name: Base de test
        run: |
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --class=E2EOfflineSeeder --force

      - name: Démarrer l'application
        run: |
          php artisan serve --host=127.0.0.1 --port=8099 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/up > /dev/null && exit 0
            sleep 1
          done
          echo "Le serveur n'a pas démarré" && cat storage/logs/serve.log && exit 1

      - name: Scénario hors ligne
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" npm run test:e2e

      - name: Journaux en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: storage/logs/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Style de code (informatif, non bloquant)
  # ─────────────────────────────────────────────
  style:
    name: Style (Pint, informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - run: vendor/bin/pint --test
